# Tests every PR and every change to main; deploys main to GitHub Pages when tests pass (D8, D16).
# The "test" job is the required check on main: nothing merges red.
# Security (public repo): read-only token by default, never pull_request_target, no secrets used here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Make new visual snapshot pictures (download them from the run, check, commit)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }} # a manual snapshot run never cancels a waiting deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same checks as `npm run check`, split across machines that run at the same time: type check and unit tests on
  # one, browser tests shared out over several ("shards": Playwright gives each an equal part, so new tests and new
  # screen sizes are included automatically).
  #
  # What a run tests (D20, plan step 10), decided by tools/ci/scope.mjs (fixed rules, unit-tested):
  # - main, manual runs, anything unsure: everything;
  # - a PR that changes only Markdown: type check and unit tests only;
  # - a PR that changes only one game: everything except the OTHER games' browser tests (tagged @game:<id>).
  # It also counts the browser tests and starts about one machine per 50 (never fewer than 3).
  scope:
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      grep: ${{ steps.scope.outputs.grep }}
      shard_total: ${{ steps.scope.outputs.shard_total }}
      shards: ${{ steps.scope.outputs.shards }}
    env:
      CI: 'true'
      VISUAL: '1' # so the visual tests are counted (visual.spec.js refuses to load on GitHub without it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # on a PR this is the merge commit and its parent on main: exactly what would merge
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/ci/scope.mjs --event "$EVENT"

  checks:
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  browser:
    needs: scope
    if: ${{ !inputs.update_snapshots && needs.scope.outputs.mode != 'docs' }}
    # Pinned (not ubuntu-latest): visual snapshots depend on the machine's fonts. Keep in step with claude.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false # finish every shard, so one red run shows all failures
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    env:
      CI: 'true'
      VISUAL: '1'
      MODE: ${{ needs.scope.outputs.mode }}
      GREP: ${{ needs.scope.outputs.grep }}
      TOTAL: ${{ needs.scope.outputs.shard_total }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browsers are kept between runs (keyed by the lockfile, so a Playwright upgrade gets fresh ones). The
      # system packages and fonts are always installed fresh, so the pictures don't depend on the cache.
      - name: Restore test browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium webkit
      - if: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium webkit
      - name: Browser tests
        run: |
          echo "Test scope: ${MODE}, shard ${SHARD} of ${TOTAL}${GREP:+, left out: ${GREP}}"
          if [ -n "$GREP" ]; then
            npx playwright test --shard="${SHARD}/${TOTAL}" --grep-invert "$GREP"
          else
            npx playwright test --shard="${SHARD}/${TOTAL}"
          fi
      - name: Upload test report and pictures (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The eval's Python tests (tools/eval, D23, D26). Not part of `test`, so it never holds up a deploy, but a red one
  # stops the AI review, which needs a green CI. pytest comes from pip with exact versions and hashes
  # (requirements-dev.txt, made from uv.lock), ready-built only, so nothing is built from source.
  eval-tests:
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the cases' base commit
          persist-credentials: false
      - name: Python tests
        working-directory: tools/eval
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps --only-binary :all: -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q

  # The required check on main. Passes only if every part above passed. It must never be skipped, because GitHub
  # counts a skipped required check as passed: `always()` keeps it running when a part fails, and on a manual snapshot
  # run (where the parts don't run) it goes red on purpose, so that run can't make a red PR look mergeable.
  # Browser tests may be skipped only when the scope job itself succeeded and said "docs".
  test:
    if: ${{ always() }}
    needs: [scope, checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All checks passed?
        env:
          SCOPE: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "scope: ${SCOPE} (${MODE:-none}); type check + unit tests: ${CHECKS}; browser tests: ${BROWSER}"
          test "${SCOPE}" = success
          test "${CHECKS}" = success
          if [ "${MODE}" = docs ]; then test "${BROWSER}" = skipped; else test "${BROWSER}" = success; fi

  # Run by hand (Actions → CI → Run workflow → update_snapshots) to make new visual snapshot pictures on the same
  # machine CI uses. It never commits: download the "snapshots" artifact, look at every picture, then commit.
  snapshots:
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      VISUAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/visual.spec.js --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: tests/e2e/visual.spec.js-snapshots/
          retention-days: 14

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Copies only the shipped files and stamps VERSION in sw.js. No npm install needed.
      - name: Prepare the site
        id: site
        run: |
          version=$(node tools/build-site.mjs _site)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Pages caches files for up to 10 minutes, so ask past the cache for the new sw.js.
      - name: Check the live site has the new version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERSION: ${{ steps.site.outputs.version }}
        run: |
          for i in $(seq 1 18); do
            if curl -fsS -H 'Cache-Control: no-cache' "${PAGE_URL}sw.js?cb=${GITHUB_SHA}" | grep -q "const VERSION = '${VERSION}';"; then
              echo "Live: version ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live sw.js does not have version ${VERSION} after 3 minutes"
          exit 1
